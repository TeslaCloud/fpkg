[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The nl crates need 1.100; the Dockerfile builds with it, CI with stable.
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
fpkg-core = { path = "crates/fpkg-core" }
fpkg-glua = { path = "crates/fpkg-glua" }

[patch.crates-io]
# The nl fork of LuaJIT as a luajit-src crate, prepared by scripts/prepare-nl.sh
# from ../nl. A build without it fails at link time on nl_version_0_1.
luajit-src = { path = "vendor/luajit-src" }
