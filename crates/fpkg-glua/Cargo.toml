[package]
name = "fpkg-glua"
description = "A Garry's Mod server-side Lua environment without the game, for fpkg tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["postgres", "mysql"]
# The pg module (gmsv_pg) over PostgreSQL's wire protocol, with TLS through the
# rustls, ring and webpki-roots that ureq already brings into fpkg.
postgres = [
    "dep:bytes",
    "dep:fallible-iterator",
    "dep:postgres-protocol",
    "dep:rustls",
    "dep:rustls-webpki",
    "dep:webpki-roots",
]
# The mysqloo module (MySQLOO 9) over MySQL's client/server protocol, with TLS
# through the same rustls on ring, and RSA for caching_sha2_password.
mysql = ["dep:num-bigint", "dep:ring", "dep:rustls", "dep:rustls-webpki"]

[dependencies]
base64 = "0.23.1"
bytes = { version = "1.11", optional = true }
crc32fast = "1.5.5"
# The version of the iterator trait that postgres-protocol's messages implement.
fallible-iterator = { version = "0.2", optional = true }
hex = "0.4.3"
md-5 = "0.11.0"
# The public-key encryption of a password that caching_sha2_password and
# sha256_password ask for on a connection without TLS.
num-bigint = { version = "0.4.6", optional = true }
nl = { path = "../../../nl/crates/nl" }
postgres-protocol = { version = "0.6.12", optional = true }
# The random seed of that encryption, from the ring that rustls already uses.
ring = { version = "0.17.14", default-features = false, optional = true }
# The SQLite of the game's sql library; bundled, so the static musl and the
# MinGW builds compile it with the C compiler they already use for LuaJIT.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# With the features ureq enables, so that the tree keeps one rustls on ring.
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"], optional = true }
# rustls's own webpki, for the names of a certificate that is its own root.
rustls-webpki = { version = "0.103.17", default-features = false, features = ["alloc"], optional = true }
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
webpki-roots = { version = "1.0.10", default-features = false, optional = true }

[dev-dependencies]
# The throwaway authorities and certificates of the fake TLS servers in the tests, made on ring.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
