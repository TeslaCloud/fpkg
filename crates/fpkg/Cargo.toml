[package]
name = "fpkg"
description = "Package manager for Flux packages"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
fpkg-core = { workspace = true }
fs-err = "3.3.2"
serde_json = "1.0.154"
tempfile = "3.27.0"
time = "0.3.55"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
walkdir = "2.5.0"

# The end-to-end test of the CLI lives at the workspace root.
[[test]]
name = "e2e"
path = "../../tests/e2e/main.rs"
