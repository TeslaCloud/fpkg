# After CI passes on master (or, running CI first, by hand or on `fdoc-updated`): build fdoc.wasm,
# migrate D1, deploy with the new FDOC_VERSION and purge the docs cache. Secrets: server/README.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  repository_dispatch:
    types: [fdoc-updated]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    # `ci` is skipped for workflow_run (CI already passed to get here).
    if: >-
      always() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name != 'workflow_run' && needs.ci.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: fpkg/server
    steps:
      - uses: actions/checkout@v4
        with:
          path: fpkg
          # The commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v4
        with: { repository: Meow/fdoc, path: fdoc }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: fdoc }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fpkg/server/package-lock.json
      - run: npm ci
      - name: Build fdoc.wasm
        id: fdoc
        run: echo "version=$(scripts/build-fdoc.sh)" >> "$GITHUB_OUTPUT"
      - name: Fill in the D1 database id
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.toml
          elif grep -q 00000000-0000-0000-0000-000000000000 wrangler.toml; then
            echo "wrangler.toml has the placeholder database_id and D1_DATABASE_ID is not set" >&2
            exit 1
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy the Worker
        run: npx wrangler deploy --var "FDOC_VERSION:${{ steps.fdoc.outputs.version }}"
      - name: Purge the docs host cache
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["docs.fluxpkg.dev"]}'
          echo "deployed with FDOC_VERSION ${{ steps.fdoc.outputs.version }}"
